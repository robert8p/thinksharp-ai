services:
  - type: web
    name: humanity
    runtime: static
    buildCommand: npm install && npm run build:render
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: EXPO_PUBLIC_OPENAI_MODEL
        value: gpt-4.1-mini
      - key: EXPO_PUBLIC_MOCK_PREMIUM
        value: "false"
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
